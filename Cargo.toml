[package]
name = "intertask"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-time = { version = "0.5.0" }
embassy-sync = "0.7"
embassy-futures = "0.1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

derive-new = { version = "0.7", default-features = false }
thiserror = { version = "2.0", default-features = false }

defmt = { version = "1.0", optional = true, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "test-util", "macros"] }
static_cell = "2.1"

[features]
default = ["defmt"]

defmt = [
    "embassy-time/defmt",
    "dep:defmt"
]