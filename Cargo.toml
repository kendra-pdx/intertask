[package]
name = "intertask"
version = "0.1.0"
edition = "2024"
publish = ["kellnr"]

[dependencies]
async-trait = "0.1"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = { version = "0.5.0" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

derive-new = { version = "0.7", default-features = false }
thiserror = { version = "2.0", default-features = false }

defmt = { version = "1.0", features = ["alloc"], optional = true }

# std deps
tokio = { version = "1.52", features = ["sync"], optional = true }

[dev-dependencies]
static_cell = "2.1"
tokio = { version = "1.52", features = [
  "macros",
  "rt-multi-thread",
  "test-util"
] }

[features]
default = ["defmt", "embassy"]

defmt = ["dep:defmt", "embassy-time/defmt"]

embassy = []
std = ["dep:tokio"]
