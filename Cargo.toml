[package]
name = "intertask"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-futures = "0.1"
embassy-sync = "0.7"
embassy-time = { version = "0.5.0" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

derive-new = { version = "0.7", default-features = false }
thiserror = { version = "2.0", default-features = false }

defmt = { version = "1.0", features = ["alloc"], optional = true }

[dev-dependencies]
static_cell = "2.1"
tokio = { version = "1.49", features = [
  "macros",
  "rt-multi-thread",
  "test-util"
] }

[features]
default = ["defmt"]

defmt = ["dep:defmt", "embassy-time/defmt"]
